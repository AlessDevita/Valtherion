plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'maven-publish'
}

group = 'fr.alessdevita.valtherion'
version = '1.0-ALPHA'

repositories {
    mavenCentral()
}

application {
    mainClass = 'fr.alessdevita.valtherion.Start'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = '17.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {

    implementation fileTree(dir: 'libs', include: '**/*.jar')

    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation 'org.joml:joml:1.10.5'

    implementation 'org.lwjgl:lwjgl:3.3.3'
    implementation 'org.lwjgl:lwjgl-assimp:3.3.3'
    implementation 'org.lwjgl:lwjgl-glfw:3.3.3'
    implementation 'org.lwjgl:lwjgl-openal:3.3.3'
    implementation 'org.lwjgl:lwjgl-opengl:3.3.3'
    implementation 'org.lwjgl:lwjgl-stb:3.3.3'
    runtimeOnly 'org.lwjgl:lwjgl:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-assimp:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-glfw:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-opengl:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-openal:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-stb:3.3.3:natives-windows'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.slf4j:slf4j-api:2.0.7'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.7'

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs = ['--enable-native-access=ALL-UNNAMED', '-Djava.library.path=libs/natives']
}

jar {
    manifest {
        attributes 'Main-Class': 'fr.alessdevita.valtherion.Start'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Valtherion'
                description = 'Jeu MMORPG Java'
                url = 'https://github.com/AlessDevita/Valtherion'

                licenses {
                    license {
                        name = 'GNU General Public License, Version 3 (GPL-3.0)'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
                    }
                }

                developers {
                    developer {
                        id = 'alessdevita'
                        name = 'AlessDevita'
                        email = 'alessdevita.ad@outlook.fr'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/AlessDevita/Valtherion.git'
                    developerConnection = 'scm:git:ssh://github.com:AlessDevita/Valtherion.git'
                    url = 'https://github.com/AlessDevita/Valtherion'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'github'
            url = url("https://maven.pkg.github.com/AlessDevita/Valtherion")

            credentials {
                username = project.findProperty("gpr.user")
                password = project.findProperty("gpr.token")
            }
        }
    }
}
